<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RAG Teaching Assistant</title>
<style>
  :root { color-scheme: light; --ink: #172033; --muted: #68738a; --blue: #4f46e5; --blue-dark: #3730a3; --line: #e6e9f2; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; padding: 48px 20px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: radial-gradient(circle at top left, #e5e7ff 0, transparent 34%), linear-gradient(135deg, #f8faff 0%, #f5f3ff 100%); }
  .shell { max-width: 820px; margin: 0 auto; }
  .hero { margin-bottom: 24px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 7px; margin: 0 0 12px; color: var(--blue); font-size: 0.76rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .eyebrow::before { content: ""; width: 22px; height: 3px; border-radius: 99px; background: #818cf8; }
  h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -0.055em; line-height: 1.05; }
  .subtitle { max-width: 600px; margin: 14px 0 0; color: var(--muted); font-size: 1.04rem; line-height: 1.65; }
  .card { padding: clamp(22px, 4vw, 34px); border: 1px solid rgba(255,255,255,0.85); border-radius: 24px; background: rgba(255,255,255,0.88); box-shadow: 0 24px 65px rgba(54, 62, 120, 0.13), 0 2px 8px rgba(54, 62, 120, 0.06); backdrop-filter: blur(12px); }
  label { display: block; margin-bottom: 10px; font-size: 0.9rem; font-weight: 750; }
  textarea { display: block; width: 100%; min-height: 126px; padding: 16px 17px; resize: vertical; border: 1px solid #d9deed; border-radius: 14px; outline: none; background: #fbfcff; color: var(--ink); font: inherit; line-height: 1.55; transition: border-color 0.2s, box-shadow 0.2s; }
  textarea::placeholder { color: #9aa4b8; }
  textarea:focus { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.13); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
  .example { padding: 7px 11px; border: 1px solid #e1e5f1; border-radius: 999px; background: #fff; color: #667085; cursor: pointer; font: inherit; font-size: 0.8rem; transition: 0.2s ease; }
  .example:hover { border-color: #a5b4fc; color: var(--blue); background: #f5f3ff; }
  .actions { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  button[type="submit"] { display: inline-flex; align-items: center; gap: 9px; padding: 12px 20px; border: 0; border-radius: 12px; background: linear-gradient(135deg, var(--blue), #7c3aed); color: #fff; cursor: pointer; font: inherit; font-weight: 750; box-shadow: 0 8px 18px rgba(79, 70, 229, 0.24); transition: transform 0.2s, box-shadow 0.2s; }
  button[type="submit"]:hover { transform: translateY(-1px); box-shadow: 0 11px 22px rgba(79, 70, 229, 0.3); }
  button[type="submit"]:disabled { cursor: wait; opacity: 0.72; transform: none; }
  .send-icon { font-size: 1.1rem; }
  #status { min-height: 22px; margin: 0; color: var(--muted); font-size: 0.9rem; }
  #status.error { color: #c2410c; }
  .results { margin-top: 28px; padding-top: 25px; border-top: 1px solid var(--line); }
  .results h2 { margin: 0 0 12px; font-size: 1.02rem; }
  #answer { white-space: pre-wrap; color: #3c465a; line-height: 1.75; }
  #sources { margin-top: 23px; }
  .source-label { margin: 0 0 10px; color: var(--muted); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
  .source { display: block; margin-top: 9px; padding: 13px 15px; border: 1px solid #e1e5ff; border-radius: 12px; background: #f7f7ff; color: #4338ca; text-decoration: none; font-size: 0.9rem; transition: 0.2s ease; }
  .source:hover { border-color: #a5b4fc; background: #eef2ff; transform: translateX(3px); }
  @media (max-width: 600px) { body { padding: 30px 14px; } .card { border-radius: 18px; } .actions { align-items: stretch; flex-direction: column; } button[type="submit"] { justify-content: center; } }
</style>
</head>
<body>

<main class="shell">
  <header class="hero">
    <p class="eyebrow">Your course companion</p>
    <h1>Learn smarter with your<br />teaching assistant.</h1>
    <p class="subtitle">Ask anything about the Web Development course and get a clear answer with the right lesson and timestamp.</p>
  </header>

  <section class="card">
    <form id="questionForm" onsubmit="event.preventDefault(); askQuestion();">
      <label for="question">What would you like to learn?</label>
      <textarea id="question" rows="3" placeholder="e.g. Where is CSS introduced?" aria-label="Your course question"></textarea>
      <div class="examples" aria-label="Example questions">
        <button type="button" class="example" onclick="useExample(this)">What is the CSS box model?</button>
        <button type="button" class="example" onclick="useExample(this)">How do HTML forms work?</button>
      </div>
      <div class="actions">
        <button id="askButton" type="submit"><span class="send-icon">✦</span> Ask assistant</button>
        <div id="status" role="status" aria-live="polite"></div>
      </div>
    </form>
    <div class="results" id="results" hidden>
      <h2>Answer</h2>
      <div id="answer"></div>
      <div id="sources"></div>
    </div>
  </section>
</main>

<script>
async function askQuestion() {
  const question = document.getElementById("question").value.trim();
  const statusEl = document.getElementById("status");
  const answerEl = document.getElementById("answer");
  const sourcesEl = document.getElementById("sources");
  const resultsEl = document.getElementById("results");
  const askButton = document.getElementById("askButton");
  if (!question) { statusEl.textContent = "Type a question first."; statusEl.className = "error"; return; }

  statusEl.className = "";
  statusEl.textContent = "Searching the course...";
  askButton.disabled = true;
  answerEl.textContent = "";
  sourcesEl.innerHTML = "";
  resultsEl.hidden = true;

  const formData = new FormData();
  formData.append("question", question);

  try {
    const res = await fetch("/ask", { method: "POST", body: formData });
    const data = await res.json();

    if (data.error) throw new Error(data.error);

    statusEl.textContent = "Done";
    answerEl.textContent = data.answer;
    resultsEl.hidden = false;

    if (data.sources.length) {
      sourcesEl.innerHTML = '<p class="source-label">Recommended lessons</p>';
      data.sources.forEach(src => {
        const mins = Math.floor(src.start / 60);
        const secs = Math.floor(src.start % 60).toString().padStart(2, "0");
        const link = document.createElement("a");
        link.className = "source";
        link.href = `/videos/${encodeURIComponent(src.title)}.mp4#t=${Math.floor(src.start)}`;
        link.target = "_blank";
        link.textContent = `▶ ${src.title} (Video ${src.number}) — ${mins}:${secs}`;
        sourcesEl.appendChild(link);
      });
    }
  } catch (error) {
    statusEl.className = "error";
    statusEl.textContent = error.message || "Something went wrong. Please try again.";
  } finally {
    askButton.disabled = false;
  }
}

function useExample(button) {
  document.getElementById("question").value = button.textContent;
  document.getElementById("question").focus();
}
</script>

</body>
</html>
