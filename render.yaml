services:
  - type: web
    name: rag-based-ai-teaching-assistant
    runtime: python
    plan: free
    rootDir: RAG-assistance
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
